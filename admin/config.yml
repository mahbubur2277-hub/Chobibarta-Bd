backend:
  name: turbo-github
  turbo_site_id: ea067d0b-50d0-4b85-a86f-470665d1df13
  branch: main

media_folder: "images/news"
public_folder: "/images/news"

publish_mode: editorial_workflow

site_url: https://www.chobibartabd.online
display_url: https://www.chobibartabd.online

collections:
  - name: "news"
    label: "News Headlines"
    label_singular: "News Headline"
    folder: "review"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - label: "English Headline"
        name: "title_en"
        widget: "string"

      - label: "Bengali Headline"
        name: "title_bn"
        widget: "string"

      - label: "English Summary"
        name: "summary_en"
        widget: "text"
        required: false

      - label: "Bengali Summary"
        name: "summary_bn"
        widget: "text"
        required: false

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - Bangladesh
          - International
          - Politics
          - Economy
          - Sports
          - Education
          - Science & Technology
          - editorial
          - Miscellaneous

      - label: "News Source"
        name: "source"
        widget: "string"

      - label: "Original Article Link"
        name: "source_url"
        widget: "string"

      - label: "News Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Image Caption"
        name: "image_caption"
        widget: "string"
        required: false

      - label: "Publication Date"
        name: "date"
        widget: "datetime"

      - label: "Approved for Publication"
        name: "approved"
        widget: "boolean"
        default: false
        - name: "picture_gallery"
    label: "Miscellaneous Picture Gallery"
    folder: "picture-gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Picture Title"
        name: "title"
        widget: "string"
      - label: "Picture"
        name: "image"
        widget: "image"
      - label: "Caption"
        name: "caption"
        widget: "text"
        required: false
      - label: "Publication Date"
        name: "date"
        widget: "datetime"
      - label: "Approved for Publication"
        name: "approved"
        widget: "boolean"
        default: false
