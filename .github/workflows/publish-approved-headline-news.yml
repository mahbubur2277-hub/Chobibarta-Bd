name: Publish Approved Headline News

on:
  workflow_dispatch:
  push:
    paths:
      - "review/**"
      - ".github/workflows/publish-approved-headline-news.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare approved headline news
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("headline-news")
          output.mkdir(exist_ok=True)

          items = []

          for path in sorted(Path("review").glob("*.json")):
              try:
                  item = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  print(f"Skipping {path}: {exc}")
                  continue

              records = item if isinstance(item, list) else [item]

              for record in records:
                  if not isinstance(record, dict):
                      continue

                  if record.get("approved") is True:
                      if record.get("title_en") or record.get("title_bn"):
                          items.append(record)

          items.sort(
              key=lambda x: (
                  x.get("date")
                  or x.get("collected_at")
                  or ""
              ),
              reverse=True
          )

          (output / "index.json").write_text(
              json.dumps(items, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Prepared {len(items)} approved headlines.")
          PY

      - name: Generate approved article pages
        run: python scripts/generate_article_pages.py
      - name: Commit published headlines
        run: |
          if git diff --quiet -- headline-news/index.json; then
            echo "No headline changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add headline-news/index.json news/
          git commit -m "Publish approved headline news"
          git push origin HEAD:main
